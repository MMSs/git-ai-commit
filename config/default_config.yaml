# Git AI Commit - Default Configuration
# This file defines the default settings for AI-powered commit message generation

# Commit message suggestion settings
suggestion:
  # Convention to use: conventional, gitmoji, or traditional
  convention: conventional
  # Format: single-line or multi-line
  format: multi-line
  # Maximum characters per line
  max_length_per_line: 72

# OpenAI API settings
# Recommended models (Chat Completions, text-only requests):
#   - gpt-6-luna (default: fast, inexpensive commit summaries)
#   - gpt-6.1-sol (more complex changes; minimum effort: low)
#   - gpt-6-astra (highest capability; minimum effort: low)
#   - gpt-5.4-mini (GPT-5 alternative)
# See README.md for supported models and automatic effort translation.
openai:
  model: gpt-6-luna

  # Temperature: Sent for GPT-5.1+ and GPT-6 only at effective effort "none".
  # Always omitted for original GPT-5 and o-series reasoning models.
  temperature: 0.7

  # Max tokens: 0 = use the model's output limit
  # Set to a positive number (e.g., 1000) to limit API costs
  # Sent as max_completion_tokens, including reasoning and visible output tokens.
  max_tokens: 0

  # Effort: none, minimal, low, medium, high, xhigh, max (model-dependent).
  # Unsupported none -> minimal (original GPT-5) or low (Astra / GPT-6.1 Sol).
  # Unsupported minimal -> low; excessive effort -> highest supported level.
  # Null, empty, or false -> omit effort and use API defaults.
  # Unknown models omit effort and temperature; legacy non-reasoning models ignore effort.
  reasoning_effort: none

# Context settings - control what information is included in the prompt
context:
  # Maximum input tokens to use for context (budget for API call)
  max_input_tokens: 6000

  # Include recent commit history for context
  include_commit_history: true

  # Number of recent commits to include when history is enabled
  commit_history_count: 5

  # Use smart file filtering (changed files + key project files) instead of full tree
  smart_file_filtering: true

  # Maximum lines to extract from README for project context
  readme_excerpt_lines: 30

  # Automatically detect tech stack from package files
  detect_tech_stack: true

  # Extract issue references and branch type from branch name
  analyze_branch_name: true

# Diff analysis settings - what to extract from the git diff
diff_analysis:
  # Extract function names from diff
  extract_functions: true

  # Extract import statements from diff
  extract_imports: true

  # Include change statistics summary
  summarize_stats: true

# Caching settings
caching:
  # TTL for local file-based cache in minutes
  cache_ttl_minutes: 5

  # Enable OpenAI API prompt caching (reduces costs and latency)
  enable_api_prompt_caching: true

  # Enable local file-based caching for expensive operations
  enable_local_caching: true

# Convention-specific configurations
convention_configs:
  # Conventional Commits specification
  conventional:
    types:
      - feat
      - feat!
      - fix
      - fix!
      - docs
      - style
      - refactor
      - test
      - chore
      - perf
      - ci
      - build
      - revert
    scopes: []
    single-line:
      template: "<type>(<scope>): <description>"
      example: "feat(api): add user authentication feature"
    multi-line:
      template: "<type>(<scope>): <description>\n\n<body>\n\n<footer>"
      example: "feat(api): add user authentication feature\n\n- Implemented user login and registration using JWT tokens.\n- Added password hashing and validation.\n- Updated user model to include authentication fields.\n\nFixes #123\nSigned-off-by: John Doe <john.doe@example.com>"

  # Gitmoji convention
  gitmoji:
    prefixes:
      - "✨ feat:"
      - "🐛 fix:"
      - "📚 docs:"
      - "💄 style:"
      - "♻️ refactor:"
      - "✅ test:"
      - "🔧 chore:"
    single-line:
      template: "<prefix>: <description>"
      example: "✨ feat: add user authentication feature"
    multi-line:
      template: "<prefix>: <description>\n\n<body>\n\n<footer>"
      example: "✨ feat: add user authentication feature\n\n- Implemented user login and registration using JWT tokens.\n- Added password hashing and validation.\n- Updated user model to include authentication fields.\n\nFixes #123\nSigned-off-by: John Doe <john.doe@example.com>"

  # Traditional commit messages
  traditional:
    single-line:
      template: "<description>"
      example: "Add user authentication feature"
    multi-line:
      template: "<description>\n\n<body>"
      example: "Add user authentication feature\n\n- Implemented user login and registration using JWT tokens.\n- Added password hashing and validation.\n- Updated user model to include authentication fields."
